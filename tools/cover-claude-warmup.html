<!doctype html>
<!-- 링크 공유 표지 1200×630 — pull-claude-warmup.py 가 찍어 public/p/claude-warmup/cover.png 로 -->
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#e6e3f0;font-family:"Inter Tight",Pretendard,sans-serif;color:#221f2b;display:grid;grid-template-columns:500px 1fr;gap:48px;align-items:center;padding:0 72px}
.site{position:absolute;left:72px;top:56px;font-size:22px;font-weight:600;color:#6f6b85}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 13px;border-radius:999px;font-size:20px;font-weight:600;color:#716d85;background:#e9e8f0}
.badge svg{width:19px;height:19px}
h1{font-family:"Noto Serif KR",serif;font-size:64px;letter-spacing:-.02em;margin:22px 0 26px;line-height:1.15}
.lb{font-size:22px;color:#6f6b85}
.v{font-size:104px;font-weight:700;letter-spacing:-.04em;line-height:1}
.d{font-size:24px;color:#57536b;margin-top:14px}
.card{background:#fbfaff;border-radius:22px;padding:40px 40px 34px;box-shadow:0 4px 40px rgba(40,35,80,.1)}
svg.chart{display:block;width:100%;height:auto}
.leg{display:flex;gap:22px;font-size:17px;color:#6f6b85;margin-top:14px}
.leg i{display:inline-block;width:15px;height:15px;border-radius:4px;margin-right:7px;vertical-align:-2px}
</style></head><body>
<div class="site">projects.sungd.uk</div>
<div>
  <span class="badge"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="3.2" rx=".8" fill="currentColor"/><path d="M3.6 7.2h8.8v5.3a1 1 0 0 1-1 1H4.6a1 1 0 0 1-1-1z" fill="currentColor" opacity=".55"/></svg>종료</span>
  <h1>Claude 워밍업</h1>
  <div class="lb">하루에 받는 한도</div>
  <div class="v">최대 1.5배</div>
  <div class="d">근무 중 5시간 윈도우 2개 → 3개</div>
</div>
<div class="card">
  <!-- 3시~21시, 근무 7~16시. 한 시간 = 20px, 왼쪽 여백 50 -->
  <svg class="chart" viewBox="0 0 470 250">
    <rect x="130" y="0" width="180" height="222" fill="#221f2b" opacity=".05"/>
    <text x="130" y="244" font-size="15" fill="#6f6b85" text-anchor="middle">07</text>
    <text x="310" y="244" font-size="15" fill="#6f6b85" text-anchor="middle">16</text>
    <text x="0" y="68" font-size="20" font-weight="600" fill="#221f2b">전</text>
    <rect x="130" y="44" width="98" height="36" rx="7" fill="#7c93d6"/>
    <rect x="250" y="44" width="60" height="36" rx="7" fill="#5fa88c"/>
    <rect x="310" y="44" width="40" height="36" rx="7" fill="none" stroke="#c98a8a" stroke-dasharray="4 3"/>
    <text x="470" y="72" font-size="36" font-weight="700" fill="#221f2b" text-anchor="end">2</text>
    <text x="0" y="168" font-size="20" font-weight="600" fill="#221f2b">후</text>
    <rect x="70" y="144" width="98" height="36" rx="7" fill="#7c93d6"/>
    <rect x="170" y="144" width="98" height="36" rx="7" fill="#5fa88c"/>
    <rect x="270" y="144" width="98" height="36" rx="7" fill="#9a82d4"/>
    <text x="470" y="172" font-size="36" font-weight="700" fill="#221f2b" text-anchor="end">3</text>
  </svg>
  <div class="leg"><span><i style="background:#221f2b;opacity:.12"></i>근무 07–16시</span><span><i style="border:1.5px dashed #c98a8a"></i>퇴근 뒤로 밀린 몫</span></div>
</div>
</body></html>
