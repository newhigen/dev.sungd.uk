<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다음 일정 줄 고르기</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1b1d22; --dim:#4a5160; --faint:#767d8c;
  --hair:#e2e5ea; --accent:#2563eb; --pick:#e8f0ff; --strip:#00000014;
  --sun:#7d6a68; --sat:#6b7480; --wend:#00000008;
  --c1:#2f8fe0; --c2:#e5487d; --c3:#2e8b57;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1013; --card:#181b20; --ink:#eceff3; --dim:#c3cad6; --faint:#8a93a1;
    --hair:#282c33; --accent:#4c8dff; --pick:#16243c; --strip:#ffffff22;
    --sun:#a79390; --sat:#98a0ac; --wend:#ffffff0b;
    --c1:#4ca6f0; --c2:#f2648f; --c3:#3cbb84;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:26px 20px 90px}
h1{font-size:23px;margin:0 0 6px}
.lede{color:var(--dim);margin:0 0 4px}
.now{color:var(--faint);font-size:13.5px;margin:0 0 18px}
h2{font-size:17px;margin:34px 0 2px}
h2 span{color:var(--faint);font-weight:400;font-size:13px;margin-left:8px}
.q{color:var(--dim);font-size:13.5px;margin:6px 0 0}
.row{display:grid;gap:14px;margin-top:14px}
.opt{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px 13px;
  display:flex;flex-direction:column;gap:9px}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--pick)}
.opt h3{font-size:14px;margin:0;display:flex;align-items:center;gap:8px;font-weight:600}
.opt h3 input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:none}
.opt h3 .id{color:var(--faint);font-size:11px;font-weight:400}
.opt .n{color:var(--dim);font-size:12.5px;margin:0}
.opt .tag{align-self:flex-start;font-size:11px;color:var(--accent);
  border:1px solid var(--accent);border-radius:99px;padding:1px 8px}
.stage{background:var(--bg);border-radius:10px;padding:12px;display:flex;justify-content:center}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--hair);
  padding:10px 0 12px;display:flex;gap:10px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--hair);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
#out{width:100%;min-height:74px;margin-top:10px;display:none;
  font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);
  border:1px solid var(--hair);border-radius:10px;padding:10px}

/* ── 위젯 아랫동강 흉내 ─────────────────── */
.w{width:420px;background:var(--card);border-radius:16px;padding:9px;font-size:11px;
  box-shadow:0 1px 3px rgba(0,0,0,.10)}
.hd{display:flex;align-items:center;gap:4px;height:19px;margin-bottom:4px}
.hd .ti{font-weight:700;font-size:13px;white-space:nowrap}
.hd .sp{flex:1}
.hd .b{color:var(--faint);padding:0 5px;font-size:12px}
.g{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:16px 13px 13px;
  row-gap:2px}
.g .wend{grid-row:1/4;background:var(--wend)}
.d{grid-row:1;font-size:11px;padding-left:4px;line-height:16px}
.d.sat{color:var(--sat)} .d.sun{color:var(--sun)}
.ev{border-radius:3px;font-size:9.5px;line-height:13px;padding:0 4px;overflow:hidden;
  white-space:nowrap;color:#fff}
.pad{height:27px}

.strip{display:flex;align-items:center;gap:6px;height:22px;border-radius:7px;
  background:var(--strip);padding:0 8px;margin-top:5px;overflow:hidden}
.strip.bare{background:none;padding-left:2px}
.strip.edge{background:none;padding-left:0;gap:0}
.strip .lab{color:var(--faint);font-size:10.5px;flex:none}
.strip .dot{width:6px;height:6px;border-radius:99px;background:var(--c2);flex:none}
.strip .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .t .w1{color:var(--faint)}
.strip .fill{flex:1}
.strip .r{color:var(--faint);font-size:11.5px;flex:none}
.strip.fit{display:inline-flex;margin-top:0}
.fitrow{display:flex;margin-top:5px}
.half{display:flex;gap:6px;margin-top:5px}
.half .strip{margin-top:0;flex:1;min-width:0}
.chips{display:flex;gap:5px;margin-top:5px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;height:22px;border-radius:7px;
  background:var(--strip);padding:0 8px;font-size:11.5px;white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:99px;flex:none}
.chip.more{color:var(--faint)}
.vbar{width:3px;align-self:stretch;border-radius:99px;background:var(--c2);
  margin-right:7px;flex:none}
.two{display:flex;flex-direction:column;justify-content:center;height:33px;
  border-radius:7px;background:var(--strip);padding:2px 9px;margin-top:5px}
.two .a{font-size:12.5px;font-weight:600;line-height:1.3}
.two .b{font-size:10.5px;color:var(--faint);line-height:1.3}
.hdnext{color:var(--dim);font-size:11px;white-space:nowrap;margin-left:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>다음 일정 줄 고르기</h1>
<p class="lede">아래 띠가 폭을 다 먹는데 글자는 왼쪽에만 있어요. 자리·내용·모양을 따로 골라 주세요.</p>
<p class="now">지금은 <b>시간이 있는 일정만</b> 봐요 — 하루종일 일정(추석·휴가 같은 것)은 다음으로 안 잡혀요.
앞으로 두 주 안에서 가장 이른 것 하나, 남은 시간은 아직 안 적어요.</p>

<div class="bar">
  <button id="copy">고른 것 복사</button>
  <span id="msg" style="color:var(--faint);font-size:13px"></span>
</div>

<div id="app"></div>
<textarea id="out" readonly></textarea>
</div>

<script>
// ── 위젯 아랫동강 ─────────────────────────────
// 마지막 격자 한 줄 + 다음 일정 줄. 빈 폭이 보이게 실제 비율로 그린다.
function grid(){
  var d=[21,22,23,24,25,26,27], h='';
  h+='<div class="wend" style="grid-column:6/8"></div>';
  d.forEach(function(n,i){
    var c='d'+(i===5?' sat':i===6?' sun':'');
    h+='<div class="'+c+'" style="grid-column:'+(i+1)+'">'+n+'</div>';
  });
  h+='<div class="ev" style="grid-column:4/7;grid-row:2;background:var(--c3)">추석</div>';
  return '<div class="g">'+h+'</div>';
}
function head(extra){
  return '<div class="hd"><span class="ti">8/31 – 9/27</span>'
    +(extra||'')+'<span class="sp"></span>'
    +'<span class="b">+</span><span class="b">↻</span><span class="b">오늘</span>'
    +'<span class="b">‹</span><span class="b">›</span></div>';
}
function card(inner,extra){ return '<div class="w">'+head(extra)+grid()+inner+'</div>'; }

var LINE='<span class="lab">다음</span><span class="dot"></span>'
  +'<span class="t"><span class="w1">9/4 (금) 8:30</span>&nbsp;&nbsp;스터디</span>';

var MOCK={
  full:  function(){ return card('<div class="strip">'+LINE+'</div>'); },
  fit:   function(){ return card('<div class="fitrow"><div class="strip fit">'+LINE+'</div></div>'); },
  ends:  function(){ return card('<div class="strip">'+LINE
           +'<span class="fill"></span><span class="r">사흘 뒤</span></div>'); },
  two:   function(){ return card('<div class="half">'
           +'<div class="strip"><span class="dot"></span><span class="t"><span class="w1">9/4 (금) 8:30</span>&nbsp;&nbsp;스터디</span></div>'
           +'<div class="strip"><span class="dot" style="background:var(--c1)"></span><span class="t"><span class="w1">9/8 (월) 13:00</span>&nbsp;&nbsp;월간 보고</span></div>'
           +'</div>'); },
  chips: function(){ return card('<div class="chips">'
           +'<span class="chip"><i class="dot" style="background:var(--c2)"></i>8:30 스터디</span>'
           +'<span class="chip"><i class="dot" style="background:var(--c1)"></i>13:00 월간 보고</span>'
           +'<span class="chip"><i class="dot" style="background:var(--c3)"></i>19:00 독서모임</span>'
           +'<span class="chip more">+2</span></div>'); },
  head:  function(){ return card('<div class="pad"></div>',
           '<span class="hdnext">● 9/4 (금) 8:30 스터디</span>'); },

  what1: function(){ return card('<div class="strip"><span class="lab">다음</span><span class="dot"></span>'
           +'<span class="t"><span class="w1">9/4 (금) 8:30</span>&nbsp;&nbsp;스터디</span></div>'); },
  what2: function(){ return card('<div class="strip"><span class="lab">다음</span><span class="dot"></span>'
           +'<span class="t"><span class="w1">사흘 뒤</span>&nbsp;&nbsp;스터디</span></div>'); },
  what3: function(){ return card('<div class="strip"><span class="lab">다음</span><span class="dot"></span>'
           +'<span class="t"><span class="w1">사흘 뒤 · 8:30</span>&nbsp;&nbsp;스터디</span></div>'); },
  what4: function(){ return card('<div class="strip"><span class="lab">다음</span>'
           +'<span class="dot" style="background:var(--c3)"></span>'
           +'<span class="t"><span class="w1">9/24 (목) 종일</span>&nbsp;&nbsp;추석</span></div>'); },

  bare:  function(){ return card('<div class="strip bare">'+LINE+'</div>'); },
  edge:  function(){ return card('<div class="strip edge"><i class="vbar"></i>'
           +'<span class="t"><span class="w1">9/4 (금) 8:30</span>&nbsp;&nbsp;스터디</span></div>'); },
  twoln: function(){ return card('<div class="two"><span class="a">8:30 스터디</span>'
           +'<span class="b">9/4 (금) · 사흘 뒤</span></div>'); }
};

var SECTIONS=[
  {id:'자리', t:'자리 — 남는 폭을 어떻게', q:'글자가 왼쪽에만 있어 오른쪽이 비어요. 하나만 골라 주세요.', one:true, o:[
    {id:'자리-지금', t:'그대로 (기준)', n:'띠는 폭을 다 먹고 글자는 왼쪽에만. 지금 이것', tag:'지금', m:'full'},
    {id:'자리-내용만큼', t:'내용만큼만', n:'띠를 글자 길이에 맞춰 줄인다. 오른쪽은 그냥 빈다', m:'fit'},
    {id:'자리-양끝', t:'양끝 잡기', n:'왼쪽에 제목, 오른쪽 끝에 얼마나 남았는지. 넓을수록 잘 산다', m:'ends'},
    {id:'자리-둘', t:'둘 나란히', n:'다음 일정 두 개를 반씩. 하나 끝난 뒤 뭐가 오는지도 같이 보인다', m:'two'},
    {id:'자리-칩', t:'오늘 남은 것 전부', n:'칩으로 이어 붙이고 넘치면 +2. 폭을 제일 잘 쓴다', m:'chips'},
    {id:'자리-머리글', t:'머리글로 올리기', n:'아래 줄을 없애고 제목 옆 빈 자리에. 격자가 한 줄만큼 커진다', m:'head'}
  ]},
  {id:'내용', t:'무엇을 적나', q:'여러 개 골라도 돼요.', one:false, o:[
    {id:'내용-날짜시각', t:'날짜 + 시각', n:'9/4 (금) 8:30. 지금 이것', tag:'지금', m:'what1'},
    {id:'내용-남은시간', t:'얼마나 남았는지', n:'사흘 뒤 · 40분 뒤. 오늘 것이면 분·시간까지 센다', m:'what2'},
    {id:'내용-둘다', t:'남은 시간 + 시각', n:'둘 다. 언제인지와 몇 시인지를 같이 안다', m:'what3'},
    {id:'내용-종일', t:'하루종일 일정도 다음으로', n:'지금은 빠져 있다. 넣으면 추석·휴가도 다음으로 잡힌다', m:'what4'}
  ]},
  {id:'모양', t:'모양', q:'띠를 어떻게 그릴지.', one:true, o:[
    {id:'모양-띠', t:'옅은 띠 바탕', n:'지금 이것', tag:'지금', m:'full'},
    {id:'모양-맨글자', t:'바탕 없이 글자만', n:'가볍다. 격자와 한 몸으로 보인다', m:'bare'},
    {id:'모양-왼쪽막대', t:'왼쪽에 세로 색 막대', n:'제목이 제일 잘 읽힌다. 색은 힌트만', m:'edge'},
    {id:'모양-두줄', t:'두 줄 — 시각 크게', n:'시각과 제목이 앞줄, 날짜는 뒷줄. 한 줄만큼 더 먹는다', m:'twoln'}
  ]}
];

var picked={};
function draw(){
  var h='';
  SECTIONS.forEach(function(s){
    h+='<h2>'+s.t+'<span>'+(s.one?'하나':'여러 개')+'</span></h2><p class="q">'+s.q+'</p><div class="row">';
    s.o.forEach(function(o){
      var on=s.one?picked[s.id]===o.id:!!picked[o.id];
      h+='<div class="opt'+(on?' picked':'')+'">'
        +'<h3><input type="'+(s.one?'radio':'checkbox')+'" name="'+s.id+'" '
        +'data-sec="'+s.id+'" data-id="'+o.id+'"'+(on?' checked':'')+'>'
        +o.t+' <span class="id">'+o.id+'</span></h3>'
        +(o.tag?'<span class="tag">'+o.tag+'</span>':'')
        +'<p class="n">'+o.n+'</p>'
        +'<div class="stage">'+MOCK[o.m]()+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('#app input').forEach(function(el){
    el.onchange=function(){
      var sec=SECTIONS.filter(function(s){return s.id===el.dataset.sec})[0];
      if(sec.one) picked[sec.id]=el.dataset.id;
      else picked[el.dataset.id]=el.checked;
      draw();
    };
  });
}
document.getElementById('copy').onclick=function(){
  var list=[];
  SECTIONS.forEach(function(s){
    if(s.one){ if(picked[s.id]) list.push(picked[s.id]); }
    else s.o.forEach(function(o){ if(picked[o.id]) list.push(o.id); });
  });
  var txt=list.join(', ')||'(아직 안 골랐어요)';
  var out=document.getElementById('out');
  out.style.display='block'; out.value=txt; out.select();
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  document.getElementById('msg').textContent='복사했어요';
};
draw();
</script>
</body>
</html>
