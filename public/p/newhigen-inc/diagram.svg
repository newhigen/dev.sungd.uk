<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1094" width="620" height="1094" role="img" aria-label="PM 이 만든 티켓을 리드가 나눠 실무 에이전트 둘이 맡고 합쳐 검증해 PM 에게 돌아오는 흐름">
  <style>
    /* 밤낮 두 판. img 안이라 문서 CSS 는 못 받지만 color-scheme 은 전해지므로
       제호 줄 단추로 판을 바꿔도 이 그림이 같이 따라온다 */
    svg {
      --paper: #fffefc;   /* 카드 바탕 */
      --ink: #211f1b;   /* 카드 제목 */
      --ink2: #5b544a;   /* 카드 설명 */
      --mark: #8a6a3c;   /* 짚는 색 */
      --markedge: #ddd6c8;   /* 카드 테두리 */
      --line: #b9b1a2;   /* 잇는 선 */
      --lane: #f5f3ee;   /* 레인 바탕 */
      --lane2: #efece4;   /* 레인 바탕 둘째 */
      --dim: #efece4;   /* 그전 판 바탕 */
      /* 짙게 칠한 면 — 글자색(--ink)으로 칠하면 밤에 하얗게 뒤집힌다 */
      --face: #211f1b;
      --faceink: #fffefc;
      --facesub: #c8c0b0;
      --facedot: #e8e0d0;
      --facedotink: #211f1b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #1e1c27;
        --ink: #ece9f4;
        --ink2: #c7c2d8;
        --mark: #c9a87a;
        --markedge: #5a4a30;
        --line: #4a4658;
        --lane: #232130;
        --lane2: #26242f;
        --dim: #26242f;
        --face: #372f43;
        --faceink: #f2eff8;
        --facesub: #bdb6cd;
        --facedot: #c9a87a;
        --facedotink: #241f2e;
      }
    }
  </style>

  <rect width="620" height="1094" fill="var(--paper)"/>
  <rect x="34" y="96" width="266" height="964" rx="18" fill="var(--lane)"/>
  <rect x="320" y="96" width="266" height="964" rx="18" fill="var(--lane2)"/>
  <g font-family="sans-serif">
    <g transform="translate(167 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="var(--face)"/>
      <text y="9" font-size="27" font-weight="700" fill="var(--facedot)" text-anchor="middle">사람</text>
    </g>
    <g transform="translate(453 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="var(--mark)"/>
      <text y="9" font-size="27" font-weight="700" fill="var(--paper)" text-anchor="middle">에이전트</text>
    </g>
    <path d="M167 224 V 242 q0 14 14 14 H 439 q14 0 14 14 V 269" stroke="var(--line)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M453 286 l-10 -17 h20 Z" fill="var(--line)"/>
    <path d="M453 416 V 461" stroke="var(--line)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M453 478 l-10 -17 h20 Z" fill="var(--line)"/>
    <path d="M453 608 V 653" stroke="var(--line)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M453 670 l-10 -17 h20 Z" fill="var(--line)"/>
    <path d="M453 772 V 790 q0 14 -14 14 H 181 q-14 0 -14 14 V 817" stroke="var(--line)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M167 834 l-10 -17 h20 Z" fill="var(--line)"/>
    <rect x="52" y="122" width="230" height="102" rx="16" fill="var(--paper)" stroke="var(--markedge)" stroke-width="3"/>
    <circle cx="80" cy="150" r="13" fill="var(--face)"/>
    <text x="80" y="157" font-size="16" font-weight="700" fill="var(--facedot)" text-anchor="middle">1</text>
    <text x="104" y="158" font-size="24" font-weight="700" fill="var(--ink)">티켓을 만든다</text>
    <text x="72" y="196" font-size="19" fill="var(--ink2)">맡는 자리는 PM 하나.</text>
    <rect x="338" y="286" width="230" height="130" rx="16" fill="var(--face)"/>
    <circle cx="366" cy="314" r="13" fill="var(--facedot)"/>
    <text x="366" y="321" font-size="16" font-weight="700" fill="var(--facedotink)" text-anchor="middle">2</text>
    <text x="390" y="322" font-size="24" font-weight="700" fill="var(--faceink)">리드가 나눈다</text>
    <text x="358" y="360" font-size="19" fill="var(--facesub)">위임은 이 자리에서만.</text>
    <text x="358" y="388" font-size="19" fill="var(--facesub)">에이전트는 또 못 띄운다.</text>
    <rect x="338" y="478" width="230" height="130" rx="16" fill="var(--face)"/>
    <circle cx="366" cy="506" r="13" fill="var(--facedot)"/>
    <text x="366" y="513" font-size="16" font-weight="700" fill="var(--facedotink)" text-anchor="middle">3</text>
    <text x="390" y="514" font-size="24" font-weight="700" fill="var(--faceink)">실무 둘이 맡는다</text>
    <text x="358" y="552" font-size="19" fill="var(--facesub)">공유 보드를 두고</text>
    <text x="358" y="580" font-size="19" fill="var(--facesub)">서로 직접 주고받는다.</text>
    <rect x="338" y="670" width="230" height="102" rx="16" fill="var(--face)"/>
    <circle cx="366" cy="698" r="13" fill="var(--facedot)"/>
    <text x="366" y="705" font-size="16" font-weight="700" fill="var(--facedotink)" text-anchor="middle">4</text>
    <text x="390" y="706" font-size="24" font-weight="700" fill="var(--faceink)">합쳐 검증한다</text>
    <text x="358" y="744" font-size="19" fill="var(--facesub)">첫 판에서 15/15 통과.</text>
    <rect x="52" y="834" width="230" height="102" rx="16" fill="var(--paper)" stroke="var(--markedge)" stroke-width="3"/>
    <circle cx="80" cy="862" r="13" fill="var(--face)"/>
    <text x="80" y="869" font-size="16" font-weight="700" fill="var(--facedot)" text-anchor="middle">5</text>
    <text x="104" y="870" font-size="24" font-weight="700" fill="var(--ink)">받아 본다</text>
    <text x="72" y="908" font-size="19" fill="var(--ink2)">다음 티켓을 정한다.</text>
  </g>
</svg>
