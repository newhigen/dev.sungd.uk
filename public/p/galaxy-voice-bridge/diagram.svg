<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1100" width="620" height="1100" role="img" aria-label="맥에서 Option+Space 를 누르면 갤럭시가 녹음하고, 맥이 받아 Whisper 로 전사해 커서 자리에 붙여넣는 흐름">
  <rect width="620" height="1100" fill="#fffefc"/>

  <!-- 줄(레인) = 누가 한다. 왼쪽은 맥, 오른쪽은 갤럭시 -->
  <rect x="34" y="96" width="266" height="948" rx="18" fill="#f5f3ee"/>
  <rect x="320" y="96" width="266" height="948" rx="18" fill="#efece4"/>

  <!-- 레인 이름 -->
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(167 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="#211f1b"/>
      <text y="9" font-size="27" font-weight="700" fill="#e8e0d0">맥</text>
    </g>
    <g transform="translate(453 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="#8a6a3c"/>
      <text y="9" font-size="27" font-weight="700" fill="#fffefc">갤럭시</text>
    </g>
  </g>

  <!-- 단계를 잇는 선 — 직각으로 가고 꺾이는 곳만 둥글게 -->
  <g stroke="#b9b1a2" stroke-width="3.5" fill="none" stroke-linecap="round">
    <!-- ① 맥 → ② 갤럭시 -->
    <path d="M167 268 V 300 q0 14 14 14 H 439 q14 0 14 14 V 348"/>
    <!-- ② 갤럭시 → ③ 맥 -->
    <path d="M453 588 V 620 q0 14 -14 14 H 181 q-14 0 -14 14 V 668"/>
    <!-- ③ 맥 → ④ 맥 -->
    <path d="M167 838 V 896"/>
  </g>
  <g fill="#b9b1a2">
    <path d="M453 362 l-10 -17 h20 Z"/>
    <path d="M167 682 l-10 -17 h20 Z"/>
    <path d="M167 910 l-10 -17 h20 Z"/>
  </g>

  <!-- ① 맥에서 단축키를 누른다 -->
  <g>
    <rect x="52" y="122" width="230" height="146" rx="16" fill="#fffefc" stroke="#ddd6c8" stroke-width="3"/>
    <circle cx="80" cy="150" r="13" fill="#211f1b"/>
    <text x="80" y="158" font-family="sans-serif" font-size="16" font-weight="700" fill="#e8e0d0" text-anchor="middle">1</text>
    <text x="104" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="#211f1b">누른다</text>
    <rect x="72" y="178" width="190" height="46" rx="10" fill="#211f1b"/>
    <text x="167" y="208" font-family="sans-serif" font-size="22" font-weight="600" fill="#e8e0d0" text-anchor="middle">Option + Space</text>
    <text x="167" y="248" font-family="sans-serif" font-size="18" fill="#706c62" text-anchor="middle">어느 앱에서든</text>
  </g>

  <!-- ② 갤럭시가 녹음한다 -->
  <g>
    <rect x="338" y="362" width="230" height="226" rx="16" fill="#fffefc" stroke="#ddd6c8" stroke-width="3"/>
    <circle cx="366" cy="390" r="13" fill="#8a6a3c"/>
    <text x="366" y="398" font-family="sans-serif" font-size="16" font-weight="700" fill="#fffefc" text-anchor="middle">2</text>
    <text x="390" y="398" font-family="sans-serif" font-size="24" font-weight="700" fill="#211f1b">녹음한다</text>
    <!-- 폰 모양 + 마이크 -->
    <rect x="360" y="418" width="66" height="116" rx="12" fill="#211f1b"/>
    <rect x="368" y="430" width="50" height="86" rx="5" fill="#e8e0d0"/>
    <circle cx="393" cy="466" r="13" fill="#8a6a3c"/>
    <rect x="389" y="459" width="8" height="12" rx="4" fill="#fffefc"/>
    <!-- 소리 파형 -->
    <g fill="#8a6a3c">
      <rect x="444" y="466" width="7" height="24" rx="3.5"/>
      <rect x="458" y="452" width="7" height="52" rx="3.5"/>
      <rect x="472" y="438" width="7" height="80" rx="3.5"/>
      <rect x="486" y="458" width="7" height="40" rx="3.5"/>
      <rect x="500" y="446" width="7" height="64" rx="3.5"/>
      <rect x="514" y="462" width="7" height="32" rx="3.5"/>
      <rect x="528" y="452" width="7" height="52" rx="3.5"/>
    </g>
    <text x="453" y="558" font-family="sans-serif" font-size="18" fill="#706c62" text-anchor="middle">같은 Wi-Fi 로 맥에 보낸다</text>
  </g>

  <!-- ③ 맥이 받아 글자로 옮긴다 -->
  <g>
    <rect x="52" y="682" width="230" height="156" rx="16" fill="#fffefc" stroke="#ddd6c8" stroke-width="3"/>
    <circle cx="80" cy="710" r="13" fill="#211f1b"/>
    <text x="80" y="718" font-family="sans-serif" font-size="16" font-weight="700" fill="#e8e0d0" text-anchor="middle">3</text>
    <text x="104" y="718" font-family="sans-serif" font-size="24" font-weight="700" fill="#211f1b">옮긴다</text>
    <rect x="72" y="738" width="190" height="60" rx="10" fill="#f0eee9" stroke="#ddd6c8" stroke-width="2"/>
    <text x="167" y="762" font-family="sans-serif" font-size="21" font-weight="700" fill="#211f1b" text-anchor="middle">Whisper</text>
    <text x="167" y="786" font-family="sans-serif" font-size="16" fill="#706c62" text-anchor="middle">맥 안에서 돈다</text>
    <text x="167" y="828" font-family="sans-serif" font-size="17" fill="#9a9184" text-anchor="middle">바깥으로 안 나간다</text>
  </g>

  <!-- ④ 커서 자리에 붙는다 -->
  <g>
    <rect x="52" y="910" width="230" height="122" rx="16" fill="#fffefc" stroke="#8a6a3c" stroke-width="4"/>
    <circle cx="80" cy="938" r="13" fill="#8a6a3c"/>
    <text x="80" y="946" font-family="sans-serif" font-size="16" font-weight="700" fill="#fffefc" text-anchor="middle">4</text>
    <text x="104" y="946" font-family="sans-serif" font-size="24" font-weight="700" fill="#211f1b">붙는다</text>
    <rect x="72" y="964" width="190" height="52" rx="8" fill="#f0eee9"/>
    <rect x="86" y="980" width="120" height="9" rx="4.5" fill="#b9b1a2"/>
    <rect x="86" y="998" width="74" height="9" rx="4.5" fill="#b9b1a2"/>
    <rect x="168" y="994" width="4" height="18" fill="#8a6a3c"/>
  </g>

  <text x="310" y="1076" font-family="sans-serif" font-size="18" fill="#9a9184" text-anchor="middle">받아쓰기 서버에 올리지 않는다 — 폰과 맥 사이에서 끝난다</text>
</svg>
