<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1100" width="620" height="1100" role="img" aria-label="맥에서 Option+Space 를 누르면 갤럭시가 녹음하고, 맥이 받아 Whisper 로 전사해 커서 자리에 붙여넣는 흐름">
  <style>
    /* 밤낮 두 판. img 안이라 문서 CSS 는 못 받지만 color-scheme 은 전해지므로
       제호 줄 단추로 판을 바꿔도 이 그림이 같이 따라온다 */
    svg {
      --paper: #fffefc;   /* 카드 바탕 */
      --ink: #211f1b;   /* 카드 제목 */
      --ink2: #706c62;   /* 카드 설명 */
      --ink3: #9a9184;   /* 선에 붙는 글 */
      --mark: #8a6a3c;   /* 짚는 색 */
      --markface: #e8e0d0;   /* 짚은 카드 면 */
      --markedge: #ddd6c8;   /* 짚은 카드 테두리 */
      --line: #b9b1a2;   /* 잇는 선 */
      --lane: #f5f3ee;   /* 레인 바탕 */
      --lane2: #efece4;   /* 레인 바탕 둘째 */
      --face: #211f1b;   /* 짙은 면 — 밤엔 바탕보다 조금 밝게 */
      --faceink: #e8e0d0;   /* 그 면 위 글자와 조각 */
      --facetop: #fffefc;   /* 그 면 위 제목 */
      --facesub: #c8c0b0;   /* 그 면 위 설명 */
      --facedotink: #211f1b;   /* 밝은 점 위 숫자 */
      --lane3: #f0eee9;   /* 레인 바탕 셋째 */
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #1e1c27;
        --ink: #ece9f4;
        --ink2: #c7c2d8;
        --ink3: #8c87a3;
        --mark: #c9a87a;
        --markface: #3a3020;
        --markedge: #5a4a30;
        --line: #4a4658;
        --lane: #232130;
        --lane2: #26242f;
        --face: #372f43;
        --lane3: #232130;
      }
    }
  </style>

  <rect width="620" height="1100" fill="var(--paper)"/>

  <!-- 줄(레인) = 누가 한다. 왼쪽은 맥, 오른쪽은 갤럭시 -->
  <rect x="34" y="96" width="266" height="948" rx="18" fill="var(--lane)"/>
  <rect x="320" y="96" width="266" height="948" rx="18" fill="var(--lane2)"/>

  <!-- 레인 이름 -->
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(167 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="var(--face)"/>
      <text y="9" font-size="27" font-weight="700" fill="var(--faceink)">맥</text>
    </g>
    <g transform="translate(453 56)">
      <rect x="-86" y="-25" width="172" height="50" rx="25" fill="var(--mark)"/>
      <text y="9" font-size="27" font-weight="700" fill="var(--paper)">갤럭시</text>
    </g>
  </g>

  <!-- 단계를 잇는 선 — 직각으로 가고 꺾이는 곳만 둥글게 -->
  <g stroke="var(--line)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <!-- ① 맥 → ② 갤럭시 -->
    <path d="M167 268 V 300 q0 14 14 14 H 439 q14 0 14 14 V 348"/>
    <!-- ② 갤럭시 → ③ 맥 -->
    <path d="M453 588 V 620 q0 14 -14 14 H 181 q-14 0 -14 14 V 668"/>
    <!-- ③ 맥 → ④ 맥 -->
    <path d="M167 838 V 896"/>
  </g>
  <g fill="var(--line)">
    <path d="M453 362 l-10 -17 h20 Z"/>
    <path d="M167 682 l-10 -17 h20 Z"/>
    <path d="M167 910 l-10 -17 h20 Z"/>
  </g>

  <!-- ① 맥에서 단축키를 누른다 -->
  <g>
    <rect x="52" y="122" width="230" height="146" rx="16" fill="var(--paper)" stroke="var(--markedge)" stroke-width="3"/>
    <circle cx="80" cy="150" r="13" fill="var(--face)"/>
    <text x="80" y="158" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--faceink)" text-anchor="middle">1</text>
    <text x="104" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="var(--ink)">누른다</text>
    <rect x="72" y="178" width="190" height="46" rx="10" fill="var(--face)"/>
    <text x="167" y="208" font-family="sans-serif" font-size="22" font-weight="600" fill="var(--faceink)" text-anchor="middle">Option + Space</text>
    <text x="167" y="248" font-family="sans-serif" font-size="18" fill="var(--ink2)" text-anchor="middle">어느 앱에서든</text>
  </g>

  <!-- ② 갤럭시가 녹음한다 -->
  <g>
    <rect x="338" y="362" width="230" height="226" rx="16" fill="var(--paper)" stroke="var(--markedge)" stroke-width="3"/>
    <circle cx="366" cy="390" r="13" fill="var(--mark)"/>
    <text x="366" y="398" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--paper)" text-anchor="middle">2</text>
    <text x="390" y="398" font-family="sans-serif" font-size="24" font-weight="700" fill="var(--ink)">녹음한다</text>
    <!-- 폰 모양 + 마이크 -->
    <rect x="360" y="418" width="66" height="116" rx="12" fill="var(--face)"/>
    <rect x="368" y="430" width="50" height="86" rx="5" fill="var(--faceink)"/>
    <circle cx="393" cy="466" r="13" fill="var(--mark)"/>
    <rect x="389" y="459" width="8" height="12" rx="4" fill="var(--facetop)"/>
    <!-- 소리 파형 -->
    <g fill="var(--mark)">
      <rect x="444" y="466" width="7" height="24" rx="3.5"/>
      <rect x="458" y="452" width="7" height="52" rx="3.5"/>
      <rect x="472" y="438" width="7" height="80" rx="3.5"/>
      <rect x="486" y="458" width="7" height="40" rx="3.5"/>
      <rect x="500" y="446" width="7" height="64" rx="3.5"/>
      <rect x="514" y="462" width="7" height="32" rx="3.5"/>
      <rect x="528" y="452" width="7" height="52" rx="3.5"/>
    </g>
    <text x="453" y="558" font-family="sans-serif" font-size="18" fill="var(--ink2)" text-anchor="middle">같은 Wi-Fi 로 맥에 보낸다</text>
  </g>

  <!-- ③ 맥이 받아 글자로 옮긴다 -->
  <g>
    <rect x="52" y="682" width="230" height="156" rx="16" fill="var(--paper)" stroke="var(--markedge)" stroke-width="3"/>
    <circle cx="80" cy="710" r="13" fill="var(--ink)"/>
    <text x="80" y="718" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--markface)" text-anchor="middle">3</text>
    <text x="104" y="718" font-family="sans-serif" font-size="24" font-weight="700" fill="var(--ink)">옮긴다</text>
    <rect x="72" y="738" width="190" height="60" rx="10" fill="var(--lane3)" stroke="var(--markedge)" stroke-width="2"/>
    <text x="167" y="762" font-family="sans-serif" font-size="21" font-weight="700" fill="var(--ink)" text-anchor="middle">Whisper</text>
    <text x="167" y="786" font-family="sans-serif" font-size="16" fill="var(--ink2)" text-anchor="middle">맥 안에서 돈다</text>
    <text x="167" y="828" font-family="sans-serif" font-size="17" fill="var(--ink3)" text-anchor="middle">바깥으로 안 나간다</text>
  </g>

  <!-- ④ 커서 자리에 붙는다 -->
  <g>
    <rect x="52" y="910" width="230" height="122" rx="16" fill="var(--paper)" stroke="var(--mark)" stroke-width="4"/>
    <circle cx="80" cy="938" r="13" fill="var(--mark)"/>
    <text x="80" y="946" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--paper)" text-anchor="middle">4</text>
    <text x="104" y="946" font-family="sans-serif" font-size="24" font-weight="700" fill="var(--ink)">붙는다</text>
    <rect x="72" y="964" width="190" height="52" rx="8" fill="var(--lane3)"/>
    <rect x="86" y="980" width="120" height="9" rx="4.5" fill="var(--line)"/>
    <rect x="86" y="998" width="74" height="9" rx="4.5" fill="var(--line)"/>
    <rect x="168" y="994" width="4" height="18" fill="var(--mark)"/>
  </g>

  <text x="310" y="1076" font-family="sans-serif" font-size="18" fill="var(--ink3)" text-anchor="middle">받아쓰기 서버에 올리지 않는다 — 폰과 맥 사이에서 끝난다</text>
</svg>
