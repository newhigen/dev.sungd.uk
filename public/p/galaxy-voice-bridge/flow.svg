<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1350" width="980" height="1350" role="img" aria-label="핫키 헬퍼와 수신 서버와 브리지 서비스 셋이 한 소켓으로 붙어 Option+Space 한 번을 커서 자리의 글로 옮기는 흐름">
