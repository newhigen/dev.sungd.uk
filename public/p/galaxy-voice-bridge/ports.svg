<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="맥이 여는 포트 넷 — 둘은 같은 와이파이 전체에, 둘은 127.0.0.1 에만 묶여 있다">
  <style>
    :root {
    --paper: #ffffff;
    --lane: #f2f3f4;
    --lane2: #eaebed;
    --face: #f6f7f8;
    --ink: #1c1e21;
    --ink2: #52565c;
    --ink3: #797e85;
    --line: #c3c6ca;
    --edge: #dcdee1;
    --mark: #8a6a3c;
    --markface: #f3ece1;
    --markink: #6f532a;
    --dark: #1c1e21;
    --darkink: #e9eaec;
    --bad: #b0453a;
    --badface: #f8ecea;
    --good: #2f6b4c;
    --goodface: #e9f1ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
      --paper: #16171a;
      --lane: #1e2024;
      --lane2: #25272c;
      --face: #202226;
      --ink: #e9eaec;
      --ink2: #a9adb3;
      --ink3: #868b92;
      --line: #4a4e55;
      --edge: #33363c;
      --mark: #c79a5c;
      --markface: #2d2519;
      --markink: #d9b077;
      --dark: #e9eaec;
      --darkink: #16171a;
      --bad: #d4796d;
      --badface: #2d1f1d;
      --good: #7db898;
      --goodface: #1b2621;
      }
    }
    text { font-family: system-ui, -apple-system, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect width="900" height="470" fill="var(--paper)"/>
  <text x="40" y="44" text-anchor="start" font-size="17" font-weight="700" fill="var(--ink)">포트 넷 — 어디까지 열려 있나</text>
  <rect x="40" y="74" width="470" height="352" rx="16" fill="var(--lane)" stroke="var(--edge)" stroke-width="1.5"/>
  <g><rect x="62.0" y="57.0" width="49.0" height="34.0" rx="17" fill="var(--dark)"/><text x="86.5" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="var(--darkink)">맥</text></g>
  <rect x="64" y="246" width="422" height="164" rx="12" fill="var(--paper)" stroke="var(--mark)" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="78" y="270" text-anchor="start" font-size="13" font-weight="700" fill="var(--markink)">127.0.0.1 에만 묶여 있다</text>
  <text x="78" y="289" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink2)">같은 와이파이에 있는 남이 내 녹음을 켜지 못하게</text>
  <rect x="76" y="108" width="374" height="44" rx="9" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="90" y="135" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink)" class="m">8765 UDP</text>
  <text x="202" y="130" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">맥 찾기</text>
  <text x="202" y="145" text-anchor="start" font-size="11.5" font-weight="400" fill="var(--ink3)">폰이 뿌리면 맥이 이름을 실어 답한다</text>
  <rect x="76" y="166" width="374" height="44" rx="9" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="90" y="193" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink)" class="m">8766 TCP</text>
  <text x="202" y="188" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">소리와 명령</text>
  <text x="202" y="203" text-anchor="start" font-size="11.5" font-weight="400" fill="var(--ink3)">AUDIO, STATUS, COMMAND 가 오간다</text>
  <rect x="76" y="300" width="374" height="44" rx="9" fill="var(--markface)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="90" y="327" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink)" class="m">8767 TCP</text>
  <text x="202" y="322" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">toggle 제어</text>
  <text x="202" y="337" text-anchor="start" font-size="11.5" font-weight="400" fill="var(--ink3)">핫키 헬퍼만 쓴다</text>
  <rect x="76" y="352" width="374" height="44" rx="9" fill="var(--markface)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="90" y="379" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink)" class="m">8768 TCP</text>
  <text x="202" y="374" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">whisper-server (선택)</text>
  <text x="202" y="389" text-anchor="start" font-size="11.5" font-weight="400" fill="var(--ink3)">Handy 가 없을 때만</text>
  <rect x="602" y="108" width="258" height="102" rx="14" fill="var(--lane2)" stroke="var(--mark)" stroke-width="1.5"/>
  <text x="620" y="136" text-anchor="start" font-size="15" font-weight="700" fill="var(--ink)">폰</text>
  <text x="620" y="158" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">브리지 서비스가 맥을 찾아</text>
  <text x="620" y="176" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">스스로 붙고, 끊기면 1초마다</text>
  <text x="620" y="194" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">다시 붙는다</text>
  <path d="M458 130 H 587" stroke="var(--mark)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M587 124.5 V 135.5 L 596 130 Z" fill="var(--mark)"/>
  <path d="M596 188 H 467" stroke="var(--mark)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M467 182.5 V 193.5 L 458 188 Z" fill="var(--mark)"/>
  <rect x="474.3" y="149" width="105.4" height="20" rx="10" fill="var(--paper)"/>
  <text x="527.0" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="var(--markink)">같은 와이파이 전체</text>
  <text x="602" y="270" text-anchor="start" font-size="13" font-weight="700" fill="var(--ink)">USB 가 꽂혀 있으면</text>
  <text x="602" y="292" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">adb reverse 로 열린 폰의</text>
  <text x="602" y="310" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">127.0.0.1:8766 을 250ms 만</text>
  <text x="602" y="328" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">찔러 보고, 살아 있으면 그걸</text>
  <text x="602" y="346" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink2)">쓴다 — 가장 빠르고 안 끊긴다</text>
</svg>
