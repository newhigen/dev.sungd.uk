    <article class="variant v-ribbon">
      <h3 class="variant-title"><span>6 · Signal Ribbon</span><span>리본 레벨</span></h3>
      <div class="desktop-stage"><div class="bottom-rule"></div><div class="capsule"><span class="record-dot"></span><span class="copy">녹음 중</span><span class="recording-signal"><i></i></span><span class="processing-signal"><i></i><i></i><i></i></span></div></div>
    </article>

    <article class="variant v-time">
      <h3 class="variant-title"><span>7 · Time Halo</span><span>파형 없음 + 시간</span></h3>
      <div class="desktop-stage"><div class="bottom-rule"></div><div class="capsule"><span class="record-dot"></span><span class="copy">녹음 중</span><span class="recording-signal"></span><span class="processing-signal"><i></i><i></i><i></i></span></div></div>
    </article>
  </div>

  <script>
    (() => {
      const root = document.getElementById("voice-capsule-showcase");
      const grid = root.querySelector("#special-variants");
      const labels = {
        recording: new Map([["v-mono", "REC 중"]]),
        transcribing: new Map([["v-mono", "PROC…"]]),
        cancelled: new Map([["v-mono", "CANCEL"]])
      };
      const commonLabels = { recording: "녹음 중", transcribing: "전사 중…", cancelled: "취소됨" };

      function setState(state, activeButton) {
        root.dataset.state = state;
        root.querySelectorAll(".variant").forEach((variant) => {
          const special = [...variant.classList].find((name) => labels[state].has(name));
          variant.querySelector(".copy").textContent = special ? labels[state].get(special) : commonLabels[state];
        });
        root.querySelectorAll("[data-state-choice]").forEach((button) => {
          const selected = button === activeButton;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-selected", String(selected));
        });
        grid.setAttribute("aria-labelledby", activeButton.id);
      }

      function setBackdrop(backdrop, activeButton) {
        root.dataset.backdrop = backdrop;
        root.querySelectorAll("[data-backdrop-choice]").forEach((button) => {
          const selected = button === activeButton;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-selected", String(selected));
        });
      }

      root.querySelectorAll("[data-state-choice]").forEach((button) => {
        button.addEventListener("click", () => setState(button.dataset.stateChoice, button));
      });
      root.querySelectorAll("[data-backdrop-choice]").forEach((button) => {
        button.addEventListener("click", () => setBackdrop(button.dataset.backdropChoice, button));
      });

      root.dataset.state = "recording";
      root.dataset.backdrop = "dark";

      const orbitState = { width: 168, height: 52, radius: 26, shadow: 34, motion: true };
      const orbit = root.querySelector(".v-orbit .capsule");
      function renderOrbit() {
        orbit.style.width = `${orbitState.width}px`;
        orbit.style.height = `${orbitState.height}px`;
        orbit.style.borderRadius = `${orbitState.radius}px`;
        orbit.style.boxShadow = `0 14px ${orbitState.shadow}px rgba(0,0,0,.42), 0 3px 8px rgba(0,0,0,.28), inset 0 1px 0 #fff`;
        orbit.querySelector(".recording-signal").style.animationPlayState = orbitState.motion ? "running" : "paused";
      }
      renderOrbit();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root.querySelector(".v-orbit"), onChange: renderOrbit });
        tweak.addSlider(orbitState, "width", { label: "Orbit 너비", min: 145, max: 205, unit: "px", reference: "orbit.width" });
        tweak.addSlider(orbitState, "height", { label: "Orbit 높이", min: 42, max: 58, unit: "px", reference: "orbit.height" });
        tweak.addSlider(orbitState, "radius", { label: "Orbit 모서리", min: 14, max: 29, unit: "px", reference: "orbit.radius" });
        tweak.addSlider(orbitState, "shadow", { label: "Orbit 그림자", min: 10, max: 48, unit: "px", reference: "orbit.shadow" });
        tweak.addToggle(orbitState, "motion", { label: "Orbit 움직임", reference: "orbit.motion" });
      }
    })();
  </script>
</section>
