<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="중고매장 세 곳까지의 거리를 9호선만 볼 때와 5호선까지 볼 때로 견준 막대. 마곡점 1.00에서 0.33, 목동점 1.80에서 0.51, 영등포점 1.54에서 0.58 킬로미터로 줄었다">
  <rect width="620" height="300" fill="#fffefc"/>

  <!-- 범례 — 전은 회색, 후는 파랑 -->
  <g font-family="sans-serif" font-size="14">
    <rect x="40" y="22" width="13" height="13" rx="3" fill="#c3bfb6"/>
    <text x="60" y="33" fill="#5b544a">9호선만 볼 때</text>
    <rect x="182" y="22" width="13" height="13" rx="3" fill="#2B59C3"/>
    <text x="202" y="33" fill="#5b544a">환승 노선까지 볼 때</text>
  </g>

  <!-- x 축 눈금 — 막대 위에 값을 얹지 않고 눈금으로 읽는다 -->
  <g font-family="sans-serif" font-size="12" fill="#9a938a" text-anchor="middle">
    <line x1="140" y1="62" x2="560" y2="62" stroke="#e5e0d6" stroke-width="1"/>
    <text x="140" y="56">0</text>
    <text x="256.7" y="56">0.5</text>
    <text x="373.3" y="56">1.0</text>
    <text x="490" y="56">1.5 km</text>
  </g>
  <g stroke="#f0ece4" stroke-width="1">
    <line x1="256.7" y1="62" x2="256.7" y2="272"/>
    <line x1="373.3" y1="62" x2="373.3" y2="272"/>
    <line x1="490" y1="62" x2="490" y2="272"/>
  </g>

  <!-- 마곡점 1.00 → 0.33 -->
  <g font-family="sans-serif">
    <text x="128" y="96" font-size="14" font-weight="600" fill="#211f1b" text-anchor="end">마곡점</text>
    <rect x="140" y="82" width="233.3" height="17" rx="3" fill="#c3bfb6"/>
    <text x="365" y="95" font-size="12.5" fill="#5b544a" text-anchor="end">마곡나루 1.00</text>
    <rect x="140" y="103" width="77" height="17" rx="3" fill="#2B59C3"/>
    <text x="225" y="116" font-size="12.5" font-weight="600" fill="#2B59C3">발산 0.33</text>
  </g>

  <!-- 목동점 1.80 → 0.51 -->
  <g font-family="sans-serif">
    <text x="128" y="164" font-size="14" font-weight="600" fill="#211f1b" text-anchor="end">목동점</text>
    <rect x="140" y="150" width="420" height="17" rx="3" fill="#c3bfb6"/>
    <text x="552" y="163" font-size="12.5" fill="#5b544a" text-anchor="end">신목동 1.80</text>
    <rect x="140" y="171" width="119" height="17" rx="3" fill="#2B59C3"/>
    <text x="267" y="184" font-size="12.5" font-weight="600" fill="#2B59C3">오목교 0.51</text>
  </g>

  <!-- 영등포점 1.54 → 0.58 -->
  <g font-family="sans-serif">
    <text x="128" y="232" font-size="14" font-weight="600" fill="#211f1b" text-anchor="end">영등포점</text>
    <rect x="140" y="218" width="359.3" height="17" rx="3" fill="#c3bfb6"/>
    <text x="491" y="231" font-size="12.5" fill="#5b544a" text-anchor="end">국회의사당 1.54</text>
    <rect x="140" y="239" width="135.3" height="17" rx="3" fill="#2B59C3"/>
    <text x="283" y="252" font-size="12.5" font-weight="600" fill="#2B59C3">영등포시장 0.58</text>
  </g>

  <text x="140" y="288" font-family="sans-serif" font-size="12.5" fill="#8a837a">김포공항은 9호선과 5호선이 함께 지난다. 한 노선으로만 재면 실제 동선과 어긋난다.</text>
</svg>
