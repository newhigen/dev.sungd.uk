<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="중고매장 세 곳까지의 거리를 9호선만 볼 때와 5호선까지 볼 때로 견준 막대. 마곡점 1.00에서 0.33, 목동점 1.80에서 0.51, 영등포점 1.54에서 0.58 킬로미터로 줄었다">
  <style>
    /* 밤낮 두 판. img 안이라 문서 CSS 는 못 받지만 color-scheme 은 전해지므로
       제호 줄 단추로 판을 바꿔도 이 그림이 같이 따라온다 */
    svg {
      --paper: #fffefc;   /* 종이 바탕 */
      --ink: #211f1b;   /* 매장 이름 */
      --ink2: #5b544a;   /* 막대에 붙는 역과 값 */
      --ink3: #9a938a;   /* 축 눈금 */
      --note: #8a837a;   /* 아래 각주 */
      --bar: #c3bfb6;   /* 9호선만 볼 때 막대 */
      --pick: #2B59C3;   /* 환승까지 볼 때 막대 */
      --axis: #e5e0d6;   /* 축 선 */
      --grid: #f0ece4;   /* 세로 격자 */
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #1e1c27;
        --ink: #ece9f4;
        --ink2: #c7c2d8;
        --ink3: #8c87a3;
        --note: #a9a4bd;
        --bar: #4a4658;
        --pick: #93adeb;
        --axis: #3a3746;
        --grid: #2a2736;
      }
    }
  </style>

  <rect width="620" height="300" fill="var(--paper)"/>

  <!-- 범례 — 전은 회색, 후는 파랑 -->
  <g font-family="sans-serif" font-size="14">
    <rect x="40" y="22" width="13" height="13" rx="3" fill="var(--bar)"/>
    <text x="60" y="33" fill="var(--ink2)">9호선만 볼 때</text>
    <rect x="182" y="22" width="13" height="13" rx="3" fill="var(--pick)"/>
    <text x="202" y="33" fill="var(--ink2)">환승 노선까지 볼 때</text>
  </g>

  <!-- x 축 눈금 — 막대 위에 값을 얹지 않고 눈금으로 읽는다 -->
  <g font-family="sans-serif" font-size="12" fill="var(--ink3)" text-anchor="middle">
    <line x1="140" y1="62" x2="560" y2="62" stroke="var(--axis)" stroke-width="1"/>
    <text x="140" y="56">0</text>
    <text x="256.7" y="56">0.5</text>
    <text x="373.3" y="56">1.0</text>
    <text x="490" y="56">1.5 km</text>
  </g>
  <g stroke="var(--grid)" stroke-width="1">
    <line x1="256.7" y1="62" x2="256.7" y2="272"/>
    <line x1="373.3" y1="62" x2="373.3" y2="272"/>
    <line x1="490" y1="62" x2="490" y2="272"/>
  </g>

  <!-- 마곡점 1.00 → 0.33 -->
  <g font-family="sans-serif">
    <text x="128" y="96" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="end">마곡점</text>
    <rect x="140" y="82" width="233.3" height="17" rx="3" fill="var(--bar)"/>
    <text x="365" y="95" font-size="12.5" fill="var(--ink2)" text-anchor="end">마곡나루 1.00</text>
    <rect x="140" y="103" width="77" height="17" rx="3" fill="var(--pick)"/>
    <text x="225" y="116" font-size="12.5" font-weight="600" fill="var(--pick)">발산 0.33</text>
  </g>

  <!-- 목동점 1.80 → 0.51 -->
  <g font-family="sans-serif">
    <text x="128" y="164" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="end">목동점</text>
    <rect x="140" y="150" width="420" height="17" rx="3" fill="var(--bar)"/>
    <text x="552" y="163" font-size="12.5" fill="var(--ink2)" text-anchor="end">신목동 1.80</text>
    <rect x="140" y="171" width="119" height="17" rx="3" fill="var(--pick)"/>
    <text x="267" y="184" font-size="12.5" font-weight="600" fill="var(--pick)">오목교 0.51</text>
  </g>

  <!-- 영등포점 1.54 → 0.58 -->
  <g font-family="sans-serif">
    <text x="128" y="232" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="end">영등포점</text>
    <rect x="140" y="218" width="359.3" height="17" rx="3" fill="var(--bar)"/>
    <text x="491" y="231" font-size="12.5" fill="var(--ink2)" text-anchor="end">국회의사당 1.54</text>
    <rect x="140" y="239" width="135.3" height="17" rx="3" fill="var(--pick)"/>
    <text x="283" y="252" font-size="12.5" font-weight="600" fill="var(--pick)">영등포시장 0.58</text>
  </g>

  <text x="140" y="288" font-family="sans-serif" font-size="12.5" fill="var(--note)">김포공항은 9호선과 5호선이 함께 지난다. 한 노선으로만 재면 실제 동선과 어긋난다.</text>
</svg>
