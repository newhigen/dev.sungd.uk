<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* 만든 화면 둘이 앞뒤로 놓인 모양.
       앞 창을 뒤 창에서 떼어 내는 테두리는 탭 바탕색을 따라간다 —
       밤 판에서 흰 테두리를 두면 그 선만 튄다 */
    .back { fill: #9db6d8 }
    .front { fill: #3f6fb5; stroke: #ffffff }
    @media (prefers-color-scheme: dark) {
      .back { fill: #7e9dc8 }
      .front { fill: #5d8ed2; stroke: #202226 }
    }
  </style>
  <rect class="back" x="4" y="6" width="17" height="14" rx="3"/>
  <rect class="front" x="11" y="12" width="17" height="14" rx="3" stroke-width="2.6"/>
</svg>
